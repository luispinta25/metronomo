<!doctype html>
<html lang="es" data-theme="medianoche">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metrónomo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="vendor/css/solid.min.css">
<link rel="stylesheet" href="style.css?v=6">
<title>Metrónomo</title>
<script>
// Aplica el tema antes de pintar para evitar parpadeos.
(function () {
  try {
    var c = JSON.parse(localStorage.getItem("metro.theme") || '"auto"');
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var t = c === "auto" ? (dark ? "medianoche" : "claro") : c;
    document.documentElement.dataset.theme = t;
    var k = JSON.parse(localStorage.getItem("metro.ctl") || '"regla"');
    var def = { medianoche: "disco", claro: "regla", grafito: "pend", aurora: "orbe", ambar: "pend", carmesi: "orbe" };
    document.documentElement.dataset.ctl = k === "tema" ? (def[t] || "disco") : k;
  } catch (e) { document.documentElement.dataset.ctl = "disco"; }
})();
</script>
</head>
<body>
<div class="scrim"></div>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <img class="logo logo-dark" src="img/lpsolutions-blanco.webp" alt="LPSOLUTIONS">
      <img class="logo logo-light" src="img/lpsolutions-negro.webp" alt="LPSOLUTIONS">
    </div>
    <button class="icon-btn" id="btnTheme" aria-label="Tema"><i class="fa-solid fa-palette"></i></button>
  </header>

  <main id="viewMetro" class="view active">
    <section class="card hero">
      <div class="hero-top">
        <button class="bpm" id="tempoBtn" aria-label="Cambiar tempo">
          <span id="bpmNum">62</span><small>BPM</small>
        </button>
        <span id="tempoName" class="tname">Adagio</span>
      </div>
      <div class="chips-row">
        <button class="chip" id="sigBtn"><i class="fa-solid fa-music"></i><span id="sigTxt">4/4</span></button>
        <button class="chip" id="subBtn"><span id="subVis" class="pv"></span><span id="subTxt">Negra</span></button>
        <button class="chip" id="polyChip" hidden><i class="fa-solid fa-layer-group"></i><span id="polyTxt">3:4</span></button>
      </div>
      <div class="pads" id="pads"></div>
      <div class="poly-dots" id="polyDots" hidden></div>
    </section>
    <div class="status" id="status">&nbsp;</div>

    <div class="dial-wrap">

      <!-- Disco -->
      <div class="ctl ctl-disco">
        <div class="dial" id="dial">
          <svg class="prog" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="47" pathLength="100"></circle>
            <circle class="val" id="prog" cx="50" cy="50" r="47" pathLength="100"></circle>
          </svg>
          <div class="knob">
            <div class="ring" id="ring"></div>
            <div class="face"></div>
          </div>
          <button class="arrow left js-minus" aria-label="Bajar tempo"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="arrow right js-plus" aria-label="Subir tempo"><i class="fa-solid fa-chevron-right"></i></button>
          <button class="play js-play" aria-label="Iniciar o detener"><i class="fa-solid fa-play"></i></button>
        </div>
      </div>

      <!-- Péndulo -->
      <div class="ctl ctl-pend" id="pend">
        <div class="pend-body"></div>
        <div class="rod" id="rod"><div class="weight" id="weight"></div></div>
        <div class="pend-pivot"></div>
        <div class="pend-ctl">
          <button class="mini js-minus" aria-label="Bajar tempo"><i class="fa-solid fa-minus"></i></button>
          <button class="mini main js-play" aria-label="Iniciar o detener"><i class="fa-solid fa-play"></i></button>
          <button class="mini js-plus" aria-label="Subir tempo"><i class="fa-solid fa-plus"></i></button>
        </div>
        <p class="hint">Arrastra la pesa</p>
      </div>

      <!-- Orbe -->
      <div class="ctl ctl-orb" id="orb">
        <div class="orb-dots" id="orbDots"></div>
        <div class="orb-core" id="orbCore">
          <span class="orb-bpm" id="orbBpm">62</span>
          <small>BPM</small>
          <i class="fa-solid fa-play" id="orbIco"></i>
        </div>
        <button class="mini orb-btn left js-minus" aria-label="Bajar tempo"><i class="fa-solid fa-minus"></i></button>
        <button class="mini orb-btn right js-plus" aria-label="Subir tempo"><i class="fa-solid fa-plus"></i></button>
        <p class="hint">Desliza arriba o abajo. Toca para iniciar</p>
      </div>

      <!-- Regla -->
      <div class="ctl ctl-ruler" id="ruler">
        <div class="ruler-view" id="rulerView">
          <canvas id="rulerCv"></canvas>
          <div class="needle"></div>
        </div>
        <div class="ruler-ctl">
          <button class="round js-minus" aria-label="Bajar tempo"><i class="fa-solid fa-minus"></i></button>
          <button class="round big js-play" aria-label="Iniciar o detener"><i class="fa-solid fa-play"></i></button>
          <button class="round js-plus" aria-label="Subir tempo"><i class="fa-solid fa-plus"></i></button>
        </div>
        <p class="hint">Desliza la regla</p>
      </div>

    </div>

    <div class="bottom-row">
      <button class="tap" id="tapBtn">TAP</button>
      <div class="tools">
        <button id="btnSound" aria-label="Sonido"><i class="fa-solid fa-sliders"></i></button>
        <button id="btnTimer" aria-label="Temporizador"><i class="fa-solid fa-stopwatch"></i></button>
        <button id="btnVol" aria-label="Volumen"><i class="fa-solid fa-volume-high"></i></button>
        <button id="btnAwake" aria-label="Pantalla encendida"><i class="fa-solid fa-mobile-screen"></i></button>
      </div>
    </div>
  </main>

  <main id="viewSongs" class="view">
    <h1 class="page-title">Repertorio</h1>
    <button class="btn-wide" id="saveCur"><i class="fa-solid fa-plus"></i> Guardar ajuste actual</button>
    <ul class="songs" id="songList"></ul>
    <p class="empty" id="songEmpty">Todavía no hay ajustes guardados.</p>
  </main>

  <main id="viewPractice" class="view">
    <div class="head-row">
      <h1 class="page-title">Modo de práctica</h1>
      <button class="icon-btn" id="addPractice" aria-label="Nueva práctica"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="plist" id="practiceList"></div>
    <p class="empty" id="practiceEmpty">No hay prácticas. Crea una con el botón +.</p>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="viewMetro"><i class="fa-solid fa-gauge-high"></i><span>Metrónomo</span></button>
    <button class="tab" data-view="viewSongs"><i class="fa-solid fa-music"></i><span>Repertorio</span></button>
    <button class="tab" data-view="viewPractice"><i class="fa-solid fa-clock-rotate-left"></i><span>Práctica</span></button>
  </nav>
</div>

<div class="sheet-backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
