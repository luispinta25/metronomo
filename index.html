<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metrónomo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/css/fontawesome.min.css">
<link rel="stylesheet" href="vendor/css/solid.min.css">
<link rel="stylesheet" href="style.css?v=3">
<title>Metrónomo</title>
</head>
<body>

<div class="lock" id="lock" hidden>
  <div class="lock-card">
    <i class="fa-solid fa-lock lock-ico"></i>
    <h1 id="lockTitle">Ingresa tu clave</h1>
    <p id="lockHint" class="lock-hint"></p>
    <div class="dots" id="lockDots"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <span></span><button data-k="0">0</button>
      <button data-k="del" aria-label="Borrar"><i class="fa-solid fa-delete-left"></i></button>
    </div>
  </div>
</div>

<div class="app" id="app" hidden>

  <main id="viewMetro" class="view active">
    <section class="lcd">
      <div class="lcd-head">
        <span class="tag tag-tempo">TEMPO (BPM)</span>
        <span class="tag tag-sig">Compás</span>
        <span class="tag tag-sub">Subdiv.</span>
      </div>
      <div class="lcd-row">
        <button class="lcd-tempo" id="tempoBtn" aria-label="Cambiar tempo">
          <span id="beatUnit" class="note-ico"></span>
          <span id="tempoDigits" class="seg"></span>
          <span id="tempoName" class="tempo-name">Adagio</span>
        </button>
        <button class="lcd-sig" id="sigDisplay" aria-label="Compás">
          <span id="sigDigits" class="seg"></span>
        </button>
        <button class="lcd-sub" id="subBtn" aria-label="Subdivisión">
          <span id="subIco" class="note-ico"></span>
        </button>
      </div>
      <div class="pads" id="pads"></div>
    </section>

    <div class="toolbar">
      <button id="btnSound" aria-label="Sonido"><i class="fa-solid fa-screwdriver-wrench"></i></button>
      <button id="btnTimer" aria-label="Temporizador"><i class="fa-solid fa-stopwatch"></i></button>
      <button id="btnVol" aria-label="Volumen"><i class="fa-solid fa-volume-high"></i></button>
      <button id="btnAwake" aria-label="Pantalla encendida"><i class="fa-solid fa-mobile-screen"></i></button>
    </div>
    <div class="status" id="status">&nbsp;</div>

    <div class="dial-wrap">
      <div class="dial" id="dial">
        <div class="ring" id="ring"></div>
        <div class="face"></div>
        <button class="arrow left" id="minus" aria-label="Bajar tempo"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="arrow right" id="plus" aria-label="Subir tempo"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="play" id="play" aria-label="Iniciar o detener"><i class="fa-solid fa-play"></i></button>
      </div>
    </div>

    <div class="bottom-btns">
      <button class="big" id="sigBtn">4/4</button>
      <button class="big" id="tapBtn">TAP</button>
    </div>
  </main>

  <main id="viewSongs" class="view">
    <h1 class="page-title">Repertorio</h1>
    <button class="big wide" id="saveCur"><i class="fa-solid fa-plus"></i> Guardar ajuste actual</button>
    <ul class="songs" id="songList"></ul>
    <p class="empty" id="songEmpty">Todavía no hay ajustes guardados.</p>
  </main>

  <main id="viewPractice" class="view">
    <div class="head-row">
      <h1 class="page-title">Modo de práctica</h1>
      <button class="icon-btn" id="addPractice" aria-label="Nueva práctica"><i class="fa-solid fa-plus"></i></button>
    </div>
    <div class="plist" id="practiceList"></div>
    <p class="empty" id="practiceEmpty">No hay prácticas. Crea una con el botón +.</p>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="viewMetro"><i class="fa-solid fa-gauge-high"></i><span>Metrónomo</span></button>
    <button class="tab" data-view="viewSongs"><i class="fa-solid fa-music"></i><span>Repertorio</span></button>
    <button class="tab" data-view="viewPractice"><i class="fa-solid fa-clock-rotate-left"></i><span>Práctica</span></button>
  </nav>
</div>

<div class="sheet-backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
